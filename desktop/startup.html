<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dividendenfluss</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #121814; color: #f5f8f3; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow: hidden; background: radial-gradient(circle at 88% 14%, rgba(199,244,94,.2), transparent 34%), linear-gradient(145deg, #182019 0%, #101511 68%, #0b0f0c 100%); -webkit-app-region: drag; }
      main { width: 100%; padding: 34px 38px 30px; }
      .brand { display: flex; align-items: center; gap: 10px; margin: 0 0 38px; font-size: 12px; font-weight: 760; letter-spacing: .12em; text-transform: uppercase; }
      .mark { position: relative; width: 25px; height: 25px; border: 2px solid #c7f45e; border-radius: 50%; }
      .mark::before { content: ""; position: absolute; width: 10px; height: 6px; left: 5px; top: 6px; border-left: 3px solid #c7f45e; border-bottom: 3px solid #c7f45e; transform: rotate(-45deg); }
      .brand i { color: #c7f45e; font-style: normal; }
      h1 { margin: 0; max-width: 380px; font-size: clamp(27px, 7vw, 34px); line-height: 1.02; letter-spacing: -.045em; }
      .detail { min-height: 48px; margin: 13px 0 24px; color: #a6b0a7; font-size: 14px; line-height: 1.55; }
      .progress { position: relative; height: 7px; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.12); }
      .progress-fill { width: 0; height: 100%; border-radius: inherit; background: #c7f45e; transition: width 240ms ease; }
      .progress.indeterminate .progress-fill { width: 42%; animation: search 1.35s cubic-bezier(.65,0,.35,1) infinite; }
      .footer { display: flex; align-items: center; justify-content: space-between; min-height: 40px; margin-top: 18px; }
      .percent { color: #8d998f; font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 700; }
      button { min-height: 40px; padding: 0 17px; border: 1px solid rgba(199,244,94,.45); border-radius: 999px; color: #f5f8f3; background: rgba(199,244,94,.06); font: inherit; font-size: 12px; font-weight: 720; cursor: pointer; -webkit-app-region: no-drag; }
      button:hover { color: #111711; background: #c7f45e; }
      button:focus-visible { outline: 3px solid #c7f45e; outline-offset: 3px; }
      @keyframes search { from { transform: translateX(-120%); } to { transform: translateX(340%); } }
      @media (prefers-reduced-motion: reduce) { .progress-fill { transition: none; } .progress.indeterminate .progress-fill { width: 100%; opacity: .45; animation: none; } }
    </style>
  </head>
  <body>
    <main aria-labelledby="startup-title">
      <p class="brand"><span class="mark" aria-hidden="true"></span><span>Dividenden<i>fluss</i></span></p>
      <h1 id="startup-title">Dividendenfluss startet</h1>
      <p class="detail" id="startup-detail" aria-live="polite">Wir prüfen kurz, ob eine neue Version bereitsteht.</p>
      <div class="progress indeterminate" id="startup-progress" role="progressbar" aria-label="Updatefortschritt"><div class="progress-fill"></div></div>
      <div class="footer"><span class="percent" id="startup-percent" aria-hidden="true">Updateprüfung</span><button id="startup-skip" type="button">Ohne Update starten</button></div>
    </main>
    <script src="./startup-renderer.js"></script>
  </body>
</html>
